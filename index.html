<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>WebGL Sierpinski Carpet</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; margin-top: 20px; }
        canvas { border: 1px solid #ccc; }
        .controls { margin-top: 15px; display: flex; gap: 20px; align-items: center; }
    </style>
</head>
<body>
<canvas id="gl-canvas" width="512" height="512"></canvas>

<div class="controls">
    <label>
        분할 횟수: <span id="subdiv-val">3</span>
        <input type="range" id="subdiv-slider" min="0" max="5" value="3">
    </label>
    <label>
        카펫 색상:
        <input type="color" id="carpet-color" value="#0055ff">
    </label>
    <label>
        배경 색상:
        <input type="color" id="bg-color" value="#ffffff">
    </label>
</div>

<script src="carpet.js"></script>
</body>
</html>
